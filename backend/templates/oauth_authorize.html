<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kagura Memory Cloud - Authorization</title>
<style>
/* Kagura brand v2 — flat 5-colour palette (issue #1029). Kept in sync with
   frontend/src/app/globals.css :root (--kagura-*). This template is rendered
   by the backend (no Tailwind), so the tokens are duplicated here as plain
   CSS custom properties — change both together. */
:root {
  --kagura-tokiwa: #00664b;
  --kagura-shu: #eb6100;
  --kagura-ukon: #faa916;
  --kagura-ink: #1e2020;
  --kagura-accent: #c2410c; /* WCAG 4.5:1 on white */
  --kagura-accent-hover: #a8380a;
  --kagura-tokiwa-tint: #e6f0ec;
}
* {margin:0;padding:0;box-sizing:border-box}
body {
    font-family: 'Noto Sans JP', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f6f6f3;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: var(--kagura-ink);
}
.card {
    background: white;
    border-radius: 16px;
    border: 1px solid rgba(0,0,0,0.06);
    box-shadow: 0 6px 20px -8px rgba(20,24,24,0.12);
    padding: 40px;
    max-width: 480px;
    width: 100%;
}
.logo {
    text-align: center;
    margin-bottom: 32px;
}
h1 {
    font-size: 24px;
    color: var(--kagura-ink);
    margin-bottom: 24px;
    text-align: center;
    letter-spacing: -0.02em;
}
.app-info {
    background: #f8f9fa;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
}
.app-name {
    font-size: 18px;
    font-weight: 600;
    color: var(--kagura-tokiwa);
    margin-bottom: 12px;
}
.permission-item {
    display: flex;
    align-items: center;
    padding: 8px 0;
    color: #4a5568;
}
.permission-item:before {
    content: "✓";
    color: var(--kagura-tokiwa);
    font-weight: bold;
    margin-right: 8px;
}
.user-info {
    text-align: center;
    color: #718096;
    margin-bottom: 32px;
    font-size: 14px;
}

.actions {
    display: flex;
    justify-content: center;
    gap: 16px;
}
.actions form {
    flex: none;
    width: 160px;
}
button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 9999px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
}
.approve {
    background: var(--kagura-accent);
    color: white;
}
.approve:hover {
    background: var(--kagura-accent-hover);
    box-shadow: 0 8px 20px rgba(194,65,12,0.30);
}
.deny {
    background: rgb(239 68 68);
    color: white;
}
.deny:hover {
    box-shadow: 0 8px 20px rgba(239,68,68,0.35);
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  border-radius: 9999px;
  border: 1px solid rgba(0,102,75,0.18);
  background: var(--kagura-tokiwa-tint);
}
.badge .badge-text {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.2px;
  color: var(--kagura-tokiwa);
}

.subtitle {
  text-align: center;
  color: #4b5563;
  font-size: 14px;
  margin-top: -12px;
  margin-bottom: 22px;
}

button:focus-visible {
  outline: none;
  box-shadow: 0 0 0 4px rgba(194,65,12,0.22), 0 8px 20px rgba(0,0,0,0.10);
}
.deny:focus-visible {
  box-shadow: 0 0 0 4px rgba(239,68,68,0.22), 0 8px 20px rgba(0,0,0,0.10);
}

/* Responsive button layout */
@media (max-width: 420px) {
  .actions {
    flex-direction: column;
  }
  .actions form {
    width: 100%;
  }
}

</style>
