# =============================================================================
# Kagura Memory Cloud — production docker-compose (blue-green)
# =============================================================================
# Single-host production stack with blue-green API deploy.
# Caddy is the only container exposed to the outside world.
#
# Usage (on the VM):
#   cp .env.prod.example .env.prod      # then edit secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Deploy (zero-downtime):
#   ./scripts/deploy.sh
#
# Add Ollama (local embeddings) as an override (sets EMBEDDING_PROVIDER=self_hosted):
#   docker compose -f docker-compose.prod.yml -f docker-compose.ollama.yml up -d
#
# Build context note: the api / web images are built from the source tree in
# the same repo. On the VM, `git clone` the repo next to this file, or
# `scp -r` the source, and point build.context at the right path.
# =============================================================================

# Container log rotation (#1591) — json-file capped at 50m x 3 on every service
# this file defines, so the disk is bounded without relying on the host's
# daemon.json. Rationale, and how to apply it to a running stack (`logging` is
# fixed at container creation), are in docker-compose.app.yml / README.md "Logs".
# YAML anchors are per-file, hence the repeat; log_hygiene_static.bats pins it.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

# Shared API environment (#1482). api-blue / api-green each merge this map
# with their own DEPLOY_COLOR, so it is anchored on its own and NOT attached
# to x-api-common: a YAML merge key is shallow, so a service-level
# `environment:` REPLACES whatever the common block carried — an
# `environment:` under x-api-common would be dead. Add shared API env HERE.
x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://kagura:${DB_PASSWORD}@postgres:5432/kagura
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY}
  REDIS_URL: redis://redis:6379
  API_HOST: 0.0.0.0
  API_PORT: 8080
  ENVIRONMENT: production
  PYTHONUNBUFFERED: "1"

# Shared API config — referenced by api-blue and api-green via YAML anchor.
x-api-common: &api-common
  build:
    context: ../../backend
    dockerfile: Dockerfile
  restart: always
  logging: *default-logging
  env_file:
    - .env.prod
  # #1482: the blue-green marker deploy.sh publishes. Mounted as the single
  # file, read-only, so the deploy directory (.env.prod and friends) is not
  # exposed to the container. deploy.sh writes the marker IN PLACE (cp, never
  # mv — pinned by scripts/tests/deploy_marker_inode.bats), which is what keeps
  # a single-file bind mount current without a restart. The host file MUST
  # exist before `compose up`: Docker creates a directory at a missing bind
  # source, and GET /api/v1/workers/active-color then answers 503 "unreadable".
  volumes:
    - /opt/kagura-memory/active-color:/run/kagura/active-color:ro
  depends_on:
    postgres:
      condition: service_healthy
    qdrant:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:8080/readiness"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 15s
  command: uvicorn src.api.main:app --host 0.0.0.0 --port 8080 --log-level info

services:
  # ==========================================================================
  # Databases
  # ==========================================================================

  postgres:
    # Pinned by multi-arch manifest-list digest (#1302). The 18+ Docker image
    # moved PGDATA to /var/lib/postgresql/18/docker and the volume target to
    # /var/lib/postgresql — never start this image against the old PG15
    # kagura_postgres_data volume. Cutover/rollback procedure:
    # docs/ops/postgres-18-migration-runbook.md
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    container_name: kagura-postgres
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_DB: kagura
      POSTGRES_USER: kagura
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # Pin UTC at the OS + Postgres session layer — see
      # .claude/rules/backend.md for the three-layer policy.
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data_18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kagura -d kagura"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.15.0
    container_name: kagura-qdrant
    restart: always
    logging: *default-logging
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: kagura-redis
    restart: always
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==========================================================================
  # Application — blue-green API (Issue #239)
  # ==========================================================================
  # Two identical API services share the same image, env, and dependencies.
  # Only one receives traffic at a time (controlled by Caddy upstream).
  # scripts/deploy.sh automates the switchover.
  # ==========================================================================

  api-blue:
    <<: *api-common
    container_name: kagura-api-blue
    environment:
      <<: *api-env
      DEPLOY_COLOR: blue

  api-green:
    <<: *api-common
    container_name: kagura-api-green
    environment:
      <<: *api-env
      DEPLOY_COLOR: green

  web:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${KAGURA_DOMAIN}
        NEXT_PUBLIC_APP_URL: https://${KAGURA_DOMAIN}
        NEXT_PUBLIC_ENABLE_GRAPH_VIZ: ${NEXT_PUBLIC_ENABLE_GRAPH_VIZ:-}
        # Per-deployment plan-tier label override (locale-aware JSON). Unset →
        # empty → app keeps the OSS default S/M/L. Build-time only (NEXT_PUBLIC_*
        # is inlined by `next build`); changing it needs a web image rebuild.
        NEXT_PUBLIC_PLAN_DISPLAY_NAMES: ${NEXT_PUBLIC_PLAN_DISPLAY_NAMES:-}
    container_name: kagura-web
    restart: always
    logging: *default-logging
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"

  # ==========================================================================
  # Reverse proxy — only service bound to host ports
  # ==========================================================================

  caddy:
    image: caddy:2-alpine
    container_name: kagura-caddy
    restart: always
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/kagura/origin-ca:/etc/caddy/origin-ca:ro
      # Extension point for sibling services co-resident on this VM. They drop
      # *.caddy vhost files here; Caddyfile imports them. Read-only so a sibling
      # cannot mutate it from inside this container. Adding this mount to a
      # running stack needs `docker compose up -d caddy` (recreate) — a plain
      # `restart` does NOT apply a new mount. See README "Caddy extension point".
      - /opt/kagura-caddy-extra:/opt/kagura-caddy-extra:ro
      - caddy_data:/data
      - caddy_config:/config
    # Make the host gateway resolvable as host.docker.internal so sibling vhosts
    # dropped into /opt/kagura-caddy-extra can `reverse_proxy
    # host.docker.internal:<port>` out-of-the-box — without this, that name does
    # not resolve on a Linux VM. Configured here once so the extension point is
    # usable with no further memory-cloud changes. See README "Caddy extension point".
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No hard dependency on api-blue/api-green: during normal operation only
    # one color is active. Caddy handles upstream unavailability gracefully.
    depends_on:
      - web

volumes:
  # The old PG15 volume (kagura_postgres_data) is deliberately NOT declared
  # here anymore: keeping it out of the compose file protects it from
  # `docker compose down -v` during the migration rollback window. Remove it
  # manually (docker volume rm) only after the rollback window is formally
  # closed — see docs/ops/postgres-18-migration-runbook.md.
  postgres_data_18:
    name: kagura_postgres_data_18
  qdrant_data:
    name: kagura_qdrant_data
  redis_data:
    name: kagura_redis_data
  caddy_data:
    name: kagura_caddy_data
  caddy_config:
    name: kagura_caddy_config
