name: CI

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: cd backend && ruff check src/ tests/

      - name: Format check
        run: cd backend && ruff format --check src/ tests/

      - name: Models no-Column guard
        run: make lint-models-no-column

  backend-unit:
    runs-on: ubuntu-latest
    services:
      # Redis is required at FastAPI lifespan startup (SessionManager eagerly
      # connects via auth.session._get_or_create_redis_client). Without it,
      # any test using TestClient(app) fails at app boot. DB/Qdrant are not
      # required because tests/conftest.py::async_engine skips gracefully.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: cd backend && pip install -e ".[dev]"

      - name: Run unit tests
        env:
          REDIS_URL: redis://localhost:6379
        # tests/smoke/test_all_routes.py is excluded here: it iterates every
        # route (including Postgres-backed public endpoints) and asserts no
        # 500s, which inherently requires a running DB + migrated schema.
        # It runs in the backend-integration job below alongside tests/integration/.
        run: cd backend && pytest --ignore=tests/e2e --ignore=tests/integration --ignore=tests/smoke/test_all_routes.py -v --maxfail=5

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Type check
        run: cd frontend && npx tsc --noEmit

      - name: Build
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  # Accessibility (color-contrast) checks via Playwright + @axe-core (#780).
  # Scoped to `e2e/a11y` only — the full `test:e2e` suite includes
  # admin-user-detail.spec.ts, whose admin-auth fixture hard-requires a live
  # backend + E2E_ADMIN_* secrets and would fail here. The a11y specs are
  # hermetic: playwright.config.ts auto-starts `next dev` and /login renders
  # without auth. Required-check promotion is deferred to #768 (after 5
  # consecutive green runs).
  frontend-a11y:
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browser
        run: cd frontend && npx playwright install chromium --with-deps

      - name: Run a11y tests
        run: cd frontend && npm run test:a11y
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # Detect which paths changed so backend-integration only runs when
  # relevant. GHA does not expose `github.event.pull_request.changed_files`
  # — this is the standard monorepo path-gating pattern via
  # dorny/paths-filter outputs. Runs on all triggers (no `if:` guard) so
  # backend-integration's `needs:` dependency resolves on every event;
  # backend-integration's own `if:` gate decides whether to run.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend-integration: ${{ steps.filter.outputs.backend-integration }}
      frontend-a11y-authed: ${{ steps.filter.outputs.frontend-a11y-authed }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend-integration:
              - 'backend/src/**'
              - 'backend/alembic/versions/**'
              - 'backend/tests/integration/**'
              - 'backend/tests/smoke/test_all_routes.py'
              - 'backend/pyproject.toml'
              - '.github/workflows/ci.yml'
            frontend-a11y-authed:
              # Broad on purpose: this lane installs + runs the full stack, so any
              # file it consumes can break it. Cover the whole frontend source tree
              # (app + components + lib — the rendered /device, /invite, /workspace
              # pages pull in shared components), the e2e specs, the npm + backend
              # dependency/script manifests, and the backend it migrates/serves.
              - 'frontend/e2e/**'
              - 'frontend/src/**'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - 'frontend/playwright.config.ts'
              - 'backend/src/**'
              - 'backend/alembic/versions/**'
              - 'backend/pyproject.toml'
              - '.github/workflows/ci.yml'

  # Integration tests + the all-routes smoke test — both require a live
  # DB and Redis. Gated by detect-changes path filter, `force-integration`
  # label, workflow_dispatch, or tag push.
  backend-integration:
    runs-on: ubuntu-latest
    needs: [detect-changes, backend-unit]
    # The label-contains check is guarded by event-name so non-PR events
    # (workflow_dispatch / tag push) don't depend on PR-only context — GHA
    # treats undefined `pull_request` as null-coercible to an empty list, so
    # the bare contains() is safe in practice, but the explicit guard makes
    # the intent unambiguous to future readers.
    if: |
      needs.detect-changes.outputs.backend-integration == 'true' ||
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'force-integration')) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kagura
          POSTGRES_PASSWORD: kagura_dev_password
          POSTGRES_DB: kagura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kagura -d kagura_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: cd backend && pip install -e ".[dev]"

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://kagura:kagura_dev_password@localhost:5432/kagura_test
          REDIS_URL: redis://localhost:6379
        run: cd backend && pytest tests/integration/ tests/smoke/test_all_routes.py -v --timeout=120 --maxfail=3

  # Authenticated a11y (color-contrast) lane (#840). Unlike the hermetic
  # frontend-a11y job (next dev only), the e2e/authed-a11y/ specs need a LIVE
  # backend + an authenticated admin, so this job provisions a full stack:
  # postgres + redis + migrated schema + a seeded admin, starts the API, then
  # runs Playwright (which auto-starts `next dev` via webServer). Boot needs
  # only postgres + redis (Qdrant is /readiness-only, not /health). Gated by
  # the detect-changes path filter (same pattern as backend-integration).
  #
  # Scope (#840, first slice): runs the 3 existing specs (device / invite
  # unknown-token / workspace-dashboard) with the current login-based
  # admin-auth fixture (trace:off). The storageState globalSetup migration and
  # the Pro-workspace/invitation happy-path seed are deferred follow-ups.
  # This is a new CI-only lane — boot env / port-wait timing may need tuning
  # over the first runs; it is NOT yet a Required check (#768).
  frontend-a11y-authed:
    runs-on: ubuntu-latest
    needs: [detect-changes, frontend]
    if: |
      needs.detect-changes.outputs.frontend-a11y-authed == 'true' ||
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'force-integration')) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    env:
      # cd backend (cwd → resolves `src.api.main`) + PYTHONPATH=src (resolves the
      # bare `config`/`api` imports) mirrors how pytest (pythonpath=src) and the
      # docker CMD (uvicorn src.api.main:app) run.
      PYTHONPATH: src
      DATABASE_URL: postgresql+asyncpg://kagura:kagura_dev_password@localhost:5432/kagura_test
      REDIS_URL: redis://localhost:6379
      CORS_ORIGINS: http://localhost:3000
      E2E_ADMIN_LOGIN_ID: e2e-admin
      E2E_API_URL: http://localhost:8080
      NEXT_PUBLIC_API_URL: http://localhost:8080
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kagura
          POSTGRES_PASSWORD: kagura_dev_password
          POSTGRES_DB: kagura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kagura -d kagura_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && pip install -e ".[dev]"

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browser
        run: cd frontend && npx playwright install chromium --with-deps

      - name: Generate ephemeral secrets + admin password
        # Throwaway values for an ephemeral CI database — never reused. A valid
        # Fernet key is generated for API_KEY_SECRET in case the encryptor is
        # constructed at boot/import.
        run: |
          {
            echo "API_KEY_SECRET=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
            echo "JWT_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
            echo "AUDIT_HMAC_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
            echo "E2E_ADMIN_PASSWORD=Ci-$(python -c 'import secrets; print(secrets.token_urlsafe(18))')-9X"
          } >> "$GITHUB_ENV"

      - name: Migrate schema
        run: cd backend && alembic upgrade head

      - name: Seed e2e admin
        run: cd backend && python -m src.cli.seed_e2e_admin

      - name: Start API server
        run: |
          cd backend
          python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8080 --log-level warning &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health >/dev/null; then
              echo "API is up after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::API did not become healthy on :8080 within 60s"
          exit 1

      - name: Run authed a11y tests
        run: cd frontend && npm run test:a11y:authed

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-authed
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
