name: PR Review & Quality Checks

on:
  pull_request:
    types: [ready_for_review]  # Only when draft is unmarked (saves API tokens)
    branches:
      - main
  issue_comment:
    types: [created]  # Manual trigger with /review command

jobs:
  # Claude Code Review (AI-powered code review)
  claude-review:
    # Run on ready_for_review OR /review comment
    if: |
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '/review'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      # 1. Check permissions (Organization members only)
      - name: Check permissions
        id: check
        run: |
          AUTHOR="${{ github.event.comment.user.login }}"
          if gh api orgs/${{ github.repository_owner }}/members/$AUTHOR &>/dev/null; then
            echo "authorized=true" >> $GITHUB_OUTPUT
          else
            echo "authorized=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Post unauthorized message if user is not an org member
      - name: Post unauthorized message
        if: steps.check.outputs.authorized != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ The `/review` command is restricted to organization members.'
            })

      # 3. Add reaction to indicate review has started
      - name: Add reaction
        if: steps.check.outputs.authorized == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            })

      # 4. Checkout PR head
      - name: Checkout PR
        if: steps.check.outputs.authorized == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}
          fetch-depth: 0

      # 5. Run Claude Code Review
      - name: Run Claude Code Review
        if: steps.check.outputs.authorized == 'true'
        id: claude-review
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          allowed_tools: "mcp__github__create_pending_pull_request_review,mcp__github__add_pull_request_review_comment_to_pending_review,mcp__github__submit_pending_pull_request_review,mcp__github__get_pull_request_diff"

          direct_prompt: |
            Review this pull request and provide feedback using GitHub's review features. Follow these steps:
            1.  **Start a review:** Use \`mcp__github__create_pending_pull_request_review\` to create a pending review.
            2.  **Read the diff:** Use \`mcp__github__get_pull_request_diff\` to understand the changes and line numbers.
            3.  **Add inline comments:** Use \`mcp__github__add_pull_request_review_comment_to_pending_review\` for lines with issues. Use code suggestions when the fix is clear.
            4.  **Submit the review:** Use \`mcp__github__submit_pending_pull_request_review\` with event type "COMMENT".

            **Review criteria:**
            - Follows CLAUDE.md guidelines (DRY/SOLID, type hints 85%+)
            - No bugs or security risks
            - No performance issues
            - Adequate test coverage
            - Clear and appropriate comments

            **Important:** Only add inline comments for improvements. No positive-only comments. Lead with the conclusion, then the rationale.

          use_sticky_comment: true

      # 6. Add success reaction
      - name: Add success reaction
        if: steps.check.outputs.authorized == 'true' && success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '+1'
            })

      # 7. Add failure reaction
      - name: Add failure reaction
        if: steps.check.outputs.authorized == 'true' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '-1'
            })

  # Automated Quality Checks (lint, type, test)
  quality-checks:
    # Run on ready_for_review OR /review comment
    if: |
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '/review'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      # 1. Check permissions (Organization members only)
      - name: Check permissions
        id: check
        run: |
          AUTHOR="${{ github.event.comment.user.login }}"
          if gh api orgs/${{ github.repository_owner }}/members/$AUTHOR &>/dev/null; then
            echo "authorized=true" >> $GITHUB_OUTPUT
          else
            echo "authorized=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Post unauthorized message if user is not an org member
      - name: Post unauthorized message
        if: steps.check.outputs.authorized != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ The `/review` command is restricted to organization members.'
            })

      # 3. Add reaction to indicate checks have started
      - name: Add reaction
        if: steps.check.outputs.authorized == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            })

      # 4. Checkout PR head
      - name: Checkout PR
        if: steps.check.outputs.authorized == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}

      # 5. Setup Python
      - name: Setup Python 3.11
        if: steps.check.outputs.authorized == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      # 6. Install dependencies
      - name: Install Backend Dependencies
        if: steps.check.outputs.authorized == 'true'
        run: |
          cd backend
          pip install --upgrade pip
          pip install -e .
          pip install ruff pyright pytest pytest-cov pytest-asyncio

      # 7. Lint check
      - name: Lint Check (ruff)
        if: steps.check.outputs.authorized == 'true'
        id: lint
        run: |
          cd backend
          ruff check src/
        continue-on-error: true  # Allow existing code quality issues (will fix in #64-#80)

      # 8. Format check
      - name: Format Check (ruff)
        if: steps.check.outputs.authorized == 'true'
        id: format
        run: |
          cd backend
          ruff format --check src/
        continue-on-error: true  # Allow existing formatting issues

      # 8b. Models no-Column guard (#596 / epic #370)
      - name: Models no-Column guard
        if: steps.check.outputs.authorized == 'true'
        id: no_column_guard
        run: make lint-models-no-column

      # 9. Type check
      - name: Type Check (pyright)
        if: steps.check.outputs.authorized == 'true'
        id: type
        run: |
          cd backend
          pyright src/

      # 10. Run tests
      - name: Run Tests
        if: steps.check.outputs.authorized == 'true'
        id: tests
        run: |
          cd backend
          pytest tests/ -v --cov=src --cov-report=term-missing
        env:
          # Test environment variables
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          QDRANT_URL: http://localhost:6333
          REDIS_URL: redis://localhost:6379
          OPENAI_API_KEY: sk-test-key
          API_KEY_SECRET: test-secret-32-bytes-long-string
          JWT_SECRET: test-jwt-secret-32-bytes-long

      # 11. Check type coverage
      - name: Check Type Coverage
        if: steps.check.outputs.authorized == 'true'
        id: coverage
        run: |
          cd backend
          python -c "
          import ast, pathlib, sys
          files = list(pathlib.Path('src').rglob('*.py'))
          total = hints = 0
          for f in files:
              try:
                  tree = ast.parse(f.read_text())
                  funcs = [n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef)]
                  total += len(funcs)
                  hints += sum(1 for fn in funcs if fn.returns)
              except:
                  pass
          pct = (hints/total*100) if total else 0
          print(f'Type hints: {hints}/{total} ({pct:.1f}%)')
          sys.exit(0 if pct >= 80 else 1)
          "

      # 12. Comment PR status
      - name: Comment PR Status
        if: steps.check.outputs.authorized == 'true' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅' : '❌';
            const message = `${status} Quality checks **${{ job.status }}**

            ## Check Results
            - Lint: ${{ steps.lint.outcome || 'N/A' }}
            - Format: ${{ steps.format.outcome || 'N/A' }}
            - Type Check: ${{ steps.type.outcome || 'N/A' }}
            - Tests: ${{ steps.tests.outcome || 'N/A' }}
            - Type Coverage: ${{ steps.coverage.outcome || 'N/A' }}

            Please review the details in the Actions tab.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

      # 13. Add success reaction
      - name: Add success reaction
        if: steps.check.outputs.authorized == 'true' && success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '+1'
            })

      # 14. Add failure reaction
      - name: Add failure reaction
        if: steps.check.outputs.authorized == 'true' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '-1'
            })
