name: CI

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: cd backend && ruff check src/ tests/

      - name: Format check
        run: cd backend && ruff format --check src/ tests/

      - name: Models no-Column guard
        run: make lint-models-no-column

  # Shell-script quality gate for the blue-green deploy script. shellcheck
  # catches the `set -e` / quoting bug class behind #986 (a bare
  # `var=$(curl ...)` dying silently); the bats suite pins the three
  # verify_workers_blocked branches so that regression cannot return (#1000).
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shellcheck is preinstalled on ubuntu-latest; bats is not.
      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats

      - name: ShellCheck deploy.sh
        run: shellcheck terraform/single-server/scripts/deploy.sh

      - name: Bats — verify_workers_blocked regression suite
        run: bats terraform/single-server/scripts/tests/

  backend-unit:
    runs-on: ubuntu-latest
    services:
      # Redis is required at FastAPI lifespan startup (SessionManager eagerly
      # connects via auth.session._get_or_create_redis_client). Without it,
      # any test using TestClient(app) fails at app boot. DB/Qdrant are not
      # required because tests/conftest.py::async_engine skips gracefully.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: cd backend && pip install -e ".[dev]"

      - name: Run unit tests
        env:
          REDIS_URL: redis://localhost:6379
        # tests/smoke/test_all_routes.py is excluded here: it iterates every
        # route (including Postgres-backed public endpoints) and asserts no
        # 500s, which inherently requires a running DB + migrated schema.
        # It runs in the backend-integration job below alongside tests/integration/.
        run: cd backend && pytest --ignore=tests/e2e --ignore=tests/integration --ignore=tests/smoke/test_all_routes.py -v --maxfail=5

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Type check
        run: cd frontend && npx tsc --noEmit

      # CI builds with the webpack compiler (`--webpack`) instead of the
      # Next.js 16 default (Turbopack). Turbopack's `next build` hard-requires
      # the native @next/swc-* binding, which `npm ci` fails to provide on the
      # GitHub Actions runner (only the WASM fallback loads), aborting the
      # build on every PR. The prod Docker build (frontend/Dockerfile) still
      # uses Turbopack, so this flag is scoped to CI only — package.json's
      # shared `build` script is left as the canonical Turbopack build. See #855.
      - name: Build
        run: cd frontend && npm run build -- --webpack
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  # Accessibility (color-contrast) checks via Playwright + @axe-core (#780).
  # Scoped to `e2e/a11y` only — the full `test:e2e` suite includes
  # admin-user-detail.spec.ts, whose admin-auth fixture hard-requires a live
  # backend + E2E_ADMIN_* secrets and would fail here. The a11y specs are
  # hermetic: playwright.config.ts auto-starts `next dev` and /login renders
  # without auth. Required-check promotion is deferred to #768 (after 5
  # consecutive green runs).
  frontend-a11y:
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browser
        run: cd frontend && npx playwright install chromium --with-deps

      - name: Run a11y tests
        run: cd frontend && npm run test:a11y
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # Detect which paths changed so backend-integration only runs when
  # relevant. GHA does not expose `github.event.pull_request.changed_files`
  # — this is the standard monorepo path-gating pattern via
  # dorny/paths-filter outputs. Runs on all triggers (no `if:` guard) so
  # backend-integration's `needs:` dependency resolves on every event;
  # backend-integration's own `if:` gate decides whether to run.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend-integration: ${{ steps.filter.outputs.backend-integration }}
      frontend-a11y-authed: ${{ steps.filter.outputs.frontend-a11y-authed }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend-integration:
              - 'backend/src/**'
              - 'backend/alembic/versions/**'
              - 'backend/tests/integration/**'
              - 'backend/tests/smoke/test_all_routes.py'
              - 'backend/pyproject.toml'
              - '.github/workflows/ci.yml'
            frontend-a11y-authed:
              # Broad on purpose: this lane installs + runs the full stack, so any
              # file it consumes can break it. Cover the whole frontend source tree
              # (app + components + lib — the rendered /device, /invite, /workspace
              # pages pull in shared components), the e2e specs, the npm + backend
              # dependency/script manifests, and the backend it migrates/serves.
              - 'frontend/e2e/**'
              - 'frontend/src/**'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - 'frontend/playwright.config.ts'
              - 'backend/src/**'
              - 'backend/alembic/versions/**'
              - 'backend/pyproject.toml'
              - '.github/workflows/ci.yml'

  # Integration tests + the all-routes smoke test — both require a live
  # DB and Redis. Gated by detect-changes path filter, `force-integration`
  # label, workflow_dispatch, or tag push.
  backend-integration:
    runs-on: ubuntu-latest
    needs: [detect-changes, backend-unit]
    # The label-contains check is guarded by event-name so non-PR events
    # (workflow_dispatch / tag push) don't depend on PR-only context — GHA
    # treats undefined `pull_request` as null-coercible to an empty list, so
    # the bare contains() is safe in practice, but the explicit guard makes
    # the intent unambiguous to future readers.
    if: |
      needs.detect-changes.outputs.backend-integration == 'true' ||
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'force-integration')) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    services:
      postgres:
        image: &postgres-image postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: kagura
          POSTGRES_PASSWORD: kagura_dev_password
          POSTGRES_DB: kagura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kagura -d kagura_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: cd backend && pip install -e ".[dev]"

      # MinIO for the #994 S3-compatible storage integration test. Started as a
      # plain container (not a GHA `services:` entry) so we control the
      # `server /data` command; the test creates its own bucket. The test
      # self-skips if MINIO_TEST_ENDPOINT is unreachable, so a MinIO hiccup
      # never fails the whole integration job spuriously.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do
            if curl -fs http://localhost:9000/minio/health/live >/dev/null; then
              echo "minio up"; exit 0
            fi
            sleep 2
          done
          # Hard-fail rather than let the test silently skip — the MinIO
          # round-trip is the #994 acceptance criterion, so "MinIO never came
          # up" must turn the job red, not green-by-skip.
          echo "MinIO did not become healthy within 60s" >&2
          docker logs minio 2>&1 | tail -30 || true
          exit 1

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://kagura:kagura_dev_password@localhost:5432/kagura_test
          REDIS_URL: redis://localhost:6379
          MINIO_TEST_ENDPOINT: http://localhost:9000
          MINIO_TEST_ACCESS_KEY: minioadmin
          MINIO_TEST_SECRET_KEY: minioadmin
          MINIO_TEST_BUCKET: kagura-files-test
        run: cd backend && pytest tests/integration/ tests/smoke/test_all_routes.py -v --timeout=120 --maxfail=3

  # Authenticated a11y (color-contrast) lane (#840). Unlike the hermetic
  # frontend-a11y job (next dev only), the e2e/authed-a11y/ specs need a LIVE
  # backend + an authenticated admin, so this job provisions a full stack:
  # postgres + redis + migrated schema + a seeded admin, starts the API, then
  # runs Playwright (which auto-starts `next dev` via webServer). Boot needs
  # only postgres + redis (Qdrant is /readiness-only, not /health). Gated by
  # the detect-changes path filter (same pattern as backend-integration).
  #
  # Scope (#840, first slice): runs the 3 existing specs (device / invite
  # unknown-token / workspace-dashboard). Auth is deterministic via the
  # storageState `setup` project (#959): the admin logs in once, every spec
  # reuses the session cookie — no per-test re-login, so parallel workers can't
  # clobber each other's session (#114). The Pro-workspace/invitation
  # happy-path seed is still a deferred follow-up. This is a new CI-only lane —
  # boot env / port-wait timing may need tuning over the first runs; it is NOT
  # yet a Required check (#768).
  frontend-a11y-authed:
    runs-on: ubuntu-latest
    needs: [detect-changes, frontend]
    if: |
      needs.detect-changes.outputs.frontend-a11y-authed == 'true' ||
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'force-integration')) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    env:
      # cd backend (cwd → resolves `src.api.main`) + PYTHONPATH=src (resolves the
      # bare `config`/`api` imports) mirrors how pytest (pythonpath=src) and the
      # docker CMD (uvicorn src.api.main:app) run.
      PYTHONPATH: src
      DATABASE_URL: postgresql+asyncpg://kagura:kagura_dev_password@localhost:5432/kagura_test
      REDIS_URL: redis://localhost:6379
      CORS_ORIGINS: http://localhost:3000
      E2E_ADMIN_LOGIN_ID: e2e-admin
      E2E_API_URL: http://localhost:8080
      NEXT_PUBLIC_API_URL: http://localhost:8080
    services:
      postgres:
        image: *postgres-image
        env:
          POSTGRES_USER: kagura
          POSTGRES_PASSWORD: kagura_dev_password
          POSTGRES_DB: kagura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kagura -d kagura_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && pip install -e ".[dev]"

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browser
        run: cd frontend && npx playwright install chromium --with-deps

      - name: Generate ephemeral secrets + admin password
        # Throwaway values for an ephemeral CI database — never reused. A valid
        # Fernet key is generated for API_KEY_SECRET in case the encryptor is
        # constructed at boot/import.
        run: |
          {
            echo "API_KEY_SECRET=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
            echo "JWT_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
            echo "AUDIT_HMAC_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
            echo "E2E_ADMIN_PASSWORD=Ci-$(python -c 'import secrets; print(secrets.token_urlsafe(18))')-9X"
          } >> "$GITHUB_ENV"

      - name: Migrate schema
        run: cd backend && alembic upgrade head

      - name: Seed e2e admin
        run: cd backend && python -m src.cli.seed_e2e_admin

      - name: Start API server
        run: |
          cd backend
          python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8080 --log-level warning &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health >/dev/null; then
              echo "API is up after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::API did not become healthy on :8080 within 60s"
          exit 1

      - name: Run authed a11y tests
        run: cd frontend && npm run test:a11y:authed

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-authed
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # OAuth account-linking E2E lane (#937). Like frontend-a11y-authed it needs a
  # live backend + authenticated admin, PLUS the OAuth endpoint overrides so the
  # server-side token/userinfo exchange hits the mock IdP (frontend/e2e/mock-idp)
  # instead of real Google/GitHub. The mock IdP is started by Playwright's
  # webServer (playwright.config.ts), so no separate start step is needed here.
  # Overrides are gated by OAUTH_ENDPOINT_OVERRIDE_ENABLED and hard-blocked in
  # production (auth/oauth_endpoints.py); ENVIRONMENT is left unset → development.
  # Reuses the frontend-a11y-authed path filter (its globs already cover every
  # file this lane consumes). New CI-only lane — NOT yet a Required check (#768);
  # boot/timing may need tuning over the first runs.
  frontend-e2e-oauth:
    runs-on: ubuntu-latest
    needs: [detect-changes, frontend]
    if: |
      needs.detect-changes.outputs.frontend-a11y-authed == 'true' ||
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'force-integration')) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    env:
      PYTHONPATH: src
      DATABASE_URL: postgresql+asyncpg://kagura:kagura_dev_password@localhost:5432/kagura_test
      REDIS_URL: redis://localhost:6379
      CORS_ORIGINS: http://localhost:3000
      # The link callback redirects to {FRONTEND_URL}/profile?linked=1 — pin it to
      # the Playwright next-dev origin so the round-trip lands on the frontend (not
      # the API origin) and passes _safe_redirect_url's same-origin check.
      FRONTEND_URL: http://localhost:3000
      E2E_ADMIN_LOGIN_ID: e2e-admin
      E2E_API_URL: http://localhost:8080
      NEXT_PUBLIC_API_URL: http://localhost:8080
      # OAuth test-IdP harness (#937): redirect the server-side GitHub exchange
      # at the Playwright-managed mock IdP on :9100.
      OAUTH_ENDPOINT_OVERRIDE_ENABLED: "true"
      OAUTH_GITHUB_AUTH_URL: http://localhost:9100/github/login/oauth/authorize
      OAUTH_GITHUB_TOKEN_URL: http://localhost:9100/github/login/oauth/access_token
      OAUTH_GITHUB_USER_URL: http://localhost:9100/github/user
      OAUTH_GITHUB_EMAILS_URL: http://localhost:9100/github/user/emails
      GITHUB_CLIENT_ID: e2e-mock-client-id
      GITHUB_CLIENT_SECRET: e2e-mock-client-secret
      GITHUB_REDIRECT_URI: http://localhost:8080/api/v1/auth/github/callback
      # The GitHub callback guards on `_oauth2_manager`, which main.py only
      # initializes when GOOGLE_CLIENT_ID is set — so the GitHub-only flow still
      # needs a (dummy) Google client id or the callback 500s "Auth managers not
      # initialized". Non-secret throwaway values for an ephemeral CI run.
      GOOGLE_CLIENT_ID: e2e-mock-google-client-id
      GOOGLE_CLIENT_SECRET: e2e-mock-google-client-secret
    services:
      postgres:
        image: *postgres-image
        env:
          POSTGRES_USER: kagura
          POSTGRES_PASSWORD: kagura_dev_password
          POSTGRES_DB: kagura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kagura -d kagura_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && pip install -e ".[dev]"

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browser
        run: cd frontend && npx playwright install chromium --with-deps

      - name: Generate ephemeral secrets + admin password
        run: |
          {
            echo "API_KEY_SECRET=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
            echo "JWT_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
            echo "AUDIT_HMAC_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
            echo "E2E_ADMIN_PASSWORD=Ci-$(python -c 'import secrets; print(secrets.token_urlsafe(18))')-9X"
          } >> "$GITHUB_ENV"

      - name: Migrate schema
        run: cd backend && alembic upgrade head

      - name: Seed e2e admin
        run: cd backend && python -m src.cli.seed_e2e_admin

      - name: Start API server
        run: |
          cd backend
          python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8080 --log-level warning &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health >/dev/null; then
              echo "API is up after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::API did not become healthy on :8080 within 60s"
          exit 1

      - name: Run OAuth account-linking E2E
        run: cd frontend && npm run test:e2e:oauth

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-oauth
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
