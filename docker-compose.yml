# Kagura Memory Cloud - Local Development
#
# Usage:
#   docker compose up -d
#
# Access:
#   API:      http://localhost:8080
#   Frontend: http://localhost:3000 (run separately: cd frontend && npm run dev)
#   MCP:      http://localhost:8080/mcp

services:
  # ==========================================================================
  # Database Services
  # ==========================================================================
  # PostgreSQL (Primary DB + Graph memory)
  postgres:
    # Pinned by multi-arch manifest-list digest (#1302). The 18+ Docker image
    # moved PGDATA to /var/lib/postgresql/18/docker and the volume target to
    # /var/lib/postgresql — never mount a PG15-era data volume here.
    # Migration/rollback: docs/ops/postgres-18-migration-runbook.md
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    container_name: kagura-postgres
    environment:
      POSTGRES_DB: kagura
      POSTGRES_USER: kagura
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kagura_dev_password}
      # Pin UTC at the OS + Postgres session layer — see
      # .claude/rules/backend.md for the three-layer policy.
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      # PG18+ mounts the parent dir, not .../data. Fresh volume: local data
      # from the old postgres_data (PG15) volume is not carried over — re-run
      # `make migrate` (or restore a dump) after first start.
      - postgres_data_18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kagura -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Qdrant (Vector DB)
  qdrant:
    image: qdrant/qdrant:v1.15.0
    container_name: kagura-qdrant
    # Qdrant 1.15 opens many files per segment; under eval-scale ingest/delete
    # churn the default container nofile limit is exhausted (EMFILE crash-loop
    # at actix worker startup, os error 24 — observed 2026-07-08 on a GB10 rig
    # after the collection grew to 8 segments). 65536 gives ample headroom.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis (Cache)
  redis:
    image: redis:7-alpine
    container_name: kagura-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kagura-api
    env_file:
      - .env.local
    environment:
      # Database (local docker postgres - async driver)
      DATABASE_URL: postgresql+asyncpg://kagura:${DB_PASSWORD:-kagura_dev_password}@postgres:5432/kagura

      # Qdrant (Vector DB)
      QDRANT_URL: http://qdrant:6333

      # Redis (Cache)
      REDIS_URL: redis://redis:6379

      # OAuth2 - Let .env.local handle these
      # GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET are read from .env.local
      GOOGLE_REDIRECT_URI: http://localhost:8080/api/v1/auth/google/callback

      # Security — values from .env.local (via env_file above)
      # API_KEY_SECRET, JWT_SECRET are read from .env.local
      JWT_ALGORITHM: "HS256"
      JWT_EXPIRE_MINUTES: "60"

      # API Settings
      API_HOST: 0.0.0.0
      API_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_COLORIZE: "true"
      PYTHONUNBUFFERED: "1"

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src  # Hot reload
      - ./backend/tests:/app/tests
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8080 --reload --log-level info --use-colors

  # Frontend (Next.js dev server)
  web:
    image: node:20-alpine
    container_name: kagura-web-dev
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npx next dev --hostname 0.0.0.0"
    depends_on:
      - api

  # MinIO — S3-compatible object storage for self-host / local BYO-storage
  # testing (Issue #994). Opt-in via the `minio` profile so it does NOT start
  # with a default `docker compose up`:
  #   docker compose --profile minio up -d minio
  # Then point the API at it with STORAGE_BACKEND_TYPE=minio,
  # STORAGE_ENDPOINT_URL=http://minio:9000, STORAGE_ACCESS_KEY_ID/SECRET=minioadmin,
  # STORAGE_BUCKET=kagura-files-dev. The legacy R2_* names still work as aliases.
  #
  # ⚠ SECURITY — DEV DEFAULTS ONLY. The minioadmin/minioadmin credentials and the
  # published 9000/9001 ports below are for LOCAL development only. For a real
  # self-host deployment you MUST: (1) set strong unique MINIO_ROOT_USER /
  # MINIO_ROOT_PASSWORD (or, better, per-app access keys with bucket-scoped
  # policy), and (2) NOT expose these ports publicly — front MinIO with TLS and
  # keep it on the private network. Copying this block to production unchanged
  # leaves an open, default-credentialed object store (OWASP A05).
  minio:
    image: minio/minio
    container_name: kagura-minio
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data_18:
  qdrant_data:
  redis_data:
  frontend_node_modules:
  minio_data:
