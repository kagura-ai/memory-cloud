- id: u44-v2
  source: resource
  text: 'そなえ品貸出センターが扱う社員向けノートPCの貸出期間は一人あたり最長4週間に伸び、延長の申請も2回まで認められるようになった。返却が1日でも遅れると次回以降の貸出予約が一時停止される厳しい運用となっている。繁忙期には貸出希望が集中し、順番待ちが発生することもある。2026年7月1日更新:
