<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/icon.png">
  <title>Confirm sign in · Kagura Memory Cloud</title>
  <style nonce="{{ style_nonce }}">
    :root { color-scheme: light; font-family: "Noto Sans JP", system-ui, sans-serif; color: #1e2923; background: #f6f8f6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: clamp(12px, 4vw, 32px); }
    main { width: min(100%, 30rem); min-width: 0; padding: clamp(22px, 5vw, 36px); background: #fff; border: 1px solid #dce5df; border-radius: 16px; overflow-wrap: anywhere; }
    .brand { display: flex; align-items: center; gap: 10px; margin: 0 0 28px; color: #00664b; font-weight: 700; font-size: 1rem; }
    h1 { margin: 0 0 10px; font-size: clamp(1.5rem, 5vw, 2rem); line-height: 1.22; letter-spacing: -.025em; }
    .account { margin: 0; color: #526058; line-height: 1.55; }
    h2 { margin: 26px 0 10px; font-size: 1rem; }
    ul { margin: 0; padding: 4px 16px 4px 34px; background: #f4f8f5; border-radius: 10px; }
    li { padding: 9px 0 9px 2px; font-size: .9375rem; line-height: 1.5; }
    li::marker { color: #00664b; }
    form { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 10px; }
    button { flex: 1 1 8rem; min-height: 44px; padding: 10px 16px; font: inherit; font-weight: 600; border-radius: 8px; cursor: pointer; border: 1px solid #b9c8bf; color: #23332a; background: white; }
    button:hover { background: #f1f5f2; }
    .primary { color: white; background: #00664b; border-color: #00664b; }
    .primary:hover { background: #004e39; }
    button:focus-visible { outline: 3px solid #2163b8; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="brand"><img src="/icon.png" width="36" height="36" alt="">Kagura Memory Cloud</p>
    <h1>Sign in to {{ client_name }}</h1>
    <p class="account">Continue as <strong>{{ account }}</strong>.</p>
    <h2>Allow this application to:</h2>
    <ul>{% for permission in permissions %}<li>{{ permission }}</li>{% endfor %}</ul>
    <form method="post" action="{{ action }}">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <button class="primary" name="confirm" value="yes">Continue</button>
      <button name="confirm" value="no">Cancel</button>
    </form>
  </main>
</body>
</html>
