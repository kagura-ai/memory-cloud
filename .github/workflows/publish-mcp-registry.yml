name: Publish to MCP Registry

# Publishes server.json to the Official MCP Registry when a release tag is
# pushed (#2771), following the registry's GitHub Actions guide
# (modelcontextprotocol/registry, docs/modelcontextprotocol-io/github-actions.mdx):
# a pinned mcp-publisher verified with cosign, then validate, login through
# GitHub OIDC (the org namespace io.github.kagura-ai/* cannot be published with
# the device-flow login) and publish.
#
# A dispatch on a branch is a dry run: download, verification, the version
# guard's verdict, `validate` (a read-only check against the registry) and
# `login github-oidc` (it only exchanges the OIDC token for a registry token
# kept on the runner; nothing changes on the registry), but no publish. A
# dispatch on a tag behaves like the tag push, with the tag's own workflow and
# server.json: it re-runs a publish that failed for a cause outside the
# repository. A failed publish does not block the release or the deploy.
# backend/tests/ci/test_mcp_registry_publish.py pins the shape of this file.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time; a second one waits instead of cancelling the
# first. Per ref because GitHub cancels an older pending run of the same group:
# a branch dry run must never replace a tag run that is waiting to publish.
concurrency:
  group: publish-mcp-registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # A fork pushing a tag publishes nothing.
    if: github.repository == 'kagura-ai/memory-cloud'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job permissions replace the top-level ones: contents stays read-only,
    # id-token is the OIDC token `login github-oidc` exchanges.
    permissions:
      contents: read
      id-token: write
    env:
      # Bump deliberately: the version, then the linux_amd64 archive's digest
      # (the release's checksums file and the asset's digest agree on it).
      MCP_PUBLISHER_VERSION: v1.8.6
      MCP_PUBLISHER_SHA256: 1fbe93fc0783c2394d8012c8d6e50a59e98cb2cc2d216264cc69f405d0e21340

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # On a tag the tag must be v<server.json version>; failing here stops the
      # job before anything is downloaded. On a branch (dry run) "not a v-tag"
      # (exit 3) is reported and allowed; a broken server.json still fails.
      - name: Version guard
        id: guard
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          rc=0
          out="$(.github/scripts/check-server-json-version.sh "$REF_NAME")" || rc=$?
          if [ "$REF_TYPE" != tag ] && [ "$rc" -eq 3 ]; then
            out="dry run: ${out#::error::}"
            echo "::notice::$out"
            rc=0
          else
            echo "$out"
          fi
          echo "result=${out#::error::}" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # As the registry's guide does, plus the archive's digest: the release
      # tag cannot be moved under this workflow without the check failing.
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          [ "$(uname -s)-$(uname -m)" = Linux-x86_64 ] || { echo "::error::the digest pin is for linux_amd64"; exit 1; }
          dir="$RUNNER_TEMP/mcp-publisher"
          mkdir -p "$dir"
          cd "$dir"
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          echo "${MCP_PUBLISHER_SHA256}  $archive" | sha256sum --check --strict
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          ./mcp-publisher --version

      - name: Validate server.json
        id: validate
        run: '"$RUNNER_TEMP/mcp-publisher/mcp-publisher" validate'

      - name: Authenticate to MCP Registry
        id: login
        run: '"$RUNNER_TEMP/mcp-publisher/mcp-publisher" login github-oidc'

      - name: Publish server to MCP Registry
        id: publish
        if: github.ref_type == 'tag'
        run: '"$RUNNER_TEMP/mcp-publisher/mcp-publisher" publish'

      - name: Job summary
        if: always()
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          GUARD_RESULT: ${{ steps.guard.outputs.result }}
          VALIDATE: ${{ steps.validate.outcome }}
          LOGIN: ${{ steps.login.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
        run: |
          version="$(jq -r '.version // "unknown"' server.json 2> /dev/null || echo unknown)"
          if [ "$PUBLISH" = success ]; then
            published="yes"
          elif [ "$REF_TYPE" = tag ]; then
            published="no (validate: $VALIDATE, login: $LOGIN, publish: $PUBLISH); fix, then re-run this workflow on the tag"
          elif [ "$VALIDATE" = success ] && [ "$LOGIN" = success ]; then
            published="no (dry run: validated and logged in, nothing published)"
          else
            published="no (dry run, nothing published; validate: $VALIDATE, login: $LOGIN)"
          fi
          {
            echo "## MCP Registry publish"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| server.json version | $version |"
            echo "| ref | $REF_NAME ($REF_TYPE) |"
            echo "| version guard | ${GUARD_RESULT:-did not run} |"
            echo "| mcp-publisher | $MCP_PUBLISHER_VERSION |"
            echo "| published | $published |"
          } >> "$GITHUB_STEP_SUMMARY"
