# =============================================================================
# clamd configuration for the optional upload malware scan (Issue #565)
# =============================================================================
# Mounted read-only over the image's /etc/clamav/clamd.conf by
# docker-compose.clamav.yml (and the dev `clamav` profile in the repo root
# docker-compose.yml). It replaces the whole file, so the image's own active
# directives are repeated first; every option not named here keeps clamd's
# default (see clamd.conf(5)).
#
# The API cannot read clamd's configuration over the socket. If you run your
# own clamd instead, it needs the "Required" block below as well.
# =============================================================================

# --- The image's own directives (clamav/clamav 1.4.x) ------------------------
LogFile /var/log/clamav/clamd.log
LogTime yes
# The image's entrypoint waits for this socket before it reports clamd as
# started; keep it. freshclam also uses it to tell clamd about new signatures.
LocalSocket /tmp/clamd.sock
# TCP for the API. No TCPAddr: clamd listens on every interface INSIDE the
# container; the compose files publish no port in production.
TCPSocket 3310
User clamav

# --- Required by Kagura Memory Cloud -----------------------------------------
# Without this, a file past one of clamd's limits (size, nesting, archive
# member count, scan time) is answered "OK" although part of it was never
# scanned. With it clamd reports a Heuristics.Limits.Exceeded.* finding, which
# the API records as `error` / `unscannable` (blocked, never "clean").
AlertExceedsMax yes
# Both must be at least CLAMD_STREAM_MAX_BYTES (default 100 MiB = 100M here).
# Raise all three together; the API also refuses larger uploads at reserve
# while scanning is on.
StreamMaxLength 100M
MaxFileSize 100M
# Total bytes clamd extracts from one file (archives); clamd's default.
MaxScanSize 400M
# Milliseconds one scan may take, kept below CLAMD_SCAN_TIMEOUT_SECONDS (300):
# clamd then reports a file it could not finish as a limit finding
# (`unscannable`) instead of the API timing out and retrying it.
MaxScanTime 240000

# --- Resources ---------------------------------------------------------------
# Reload new signatures without a second copy in memory. Keeps the peak near
# one signature set (a concurrent reload can briefly double it), at the cost
# of scans waiting while a reload runs: pending uploads are held that long.
ConcurrentDatabaseReload no
# Scans clamd runs at once (clamd's default, written out because the sizing
# rule names it). Keep UVICORN_WORKERS x 2 colors x FILE_SCAN_CONCURRENCY
# below it.
MaxThreads 10
