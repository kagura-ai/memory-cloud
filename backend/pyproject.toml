[project]
name = "kagura-memory-cloud"
version = "0.14.2"
description = "Universal AI Memory Platform - Remote MCP Server + Web Management UI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Kagura AI" }
]

dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",  # Template engine for OAuth2 screens

    # Data Validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # Database (PostgreSQL)
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",         # Async PostgreSQL driver
    "psycopg2-binary>=2.9.0",  # Sync PostgreSQL driver (OAuth2 server only)
    "alembic>=1.13.0",

    # Vector Database (Qdrant)
    "qdrant-client>=1.12.0",
    "mmh3>=4.0.0",             # MurmurHash3 for sparse vector token hashing (Issue #16)
    "numpy>=1.24.0",           # Cosine similarity in neural memory (neural/utils.py)

    # LLM APIs (DB管理されたKeysを使用)
    "openai>=1.99.2",       # Embedding + Sleep LLM (reasoning_effort kwarg requires 1.99.2+, #426)
    "cohere>=5.11.0",       # Reranking (optional)
    "voyageai>=0.3.0",      # Reranking (Issue #105: Voyage AI alternative)

    # Authentication
    "authlib>=1.3.0",       # OAuth2 client/server + JWT (authlib.jose)
    "google-auth>=2.35.0",  # Google OAuth2
    "google-auth-oauthlib>=1.2.0",  # Google OAuth2 helpers
    "bcrypt>=4.0.0",        # Password hashing (Issue #51)
    "pyotp>=2.9.0",         # TOTP MFA (Issue #51)
    "qrcode[pil]>=7.4",    # QR code for MFA setup (Issue #51)

    # Cache & Queue
    "redis>=5.2.0",

    # HTTP Client
    "httpx>=0.27.0",

    # Billing (optional, for SaaS deployments with BILLING_ENABLED=true)
    "stripe>=11.0.0",

    # Transactional email (optional, when EMAIL_PROVIDER=resend)
    "resend>=2.29.0",

    # Graph Memory (NetworkX)
    "networkx>=3.0",

    # Background Tasks
    "apscheduler>=3.10.0",

    # MCP (Model Context Protocol)
    "mcp>=1.0.0",

    # Logging
    "structlog>=24.0.0",

    # Encryption
    "cryptography>=42.0.0",

    # Hashing (Issue #84 Phase 2A)
    "xxhash>=3.4.0",

    # Unicode-aware regex (Issue #122: Japanese text support)
    "regex>=2024.0.0",

    # Japanese morphological analysis (Issue #1: BM25 accuracy)
    "sudachipy>=0.6.8",
    "sudachidict-core>=20240716",

    # Environment
    "python-dotenv>=1.0.0",

    # Memory Broadlistening (#495 / umbrella #493)
    # KMeans + silhouette_score for cluster_index assignments and quality
    # metrics (Stage [D]). scipy is pulled transitively by sklearn.
    "scikit-learn>=1.4.0",
    # UMAP 2D projection for cluster scatter visualization (Stage [E]).
    # Pinned to 0.5.x so the numba JIT path is the version we test against.
    # Lazy-imported in services/analysis/projector.py — heavy import time.
    "umap-learn>=0.5,<0.6",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.12.0",
    "playwright>=1.44.0",
    "pytest-playwright>=0.5.0",

    # Type Checking
    "pyright>=1.1.0",

    # Linting & Formatting
    "ruff>=0.7.0",
]

neural = [
    # Neural Memory & Cross-encoder Reranking
    "sentence-transformers>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "e2e: end-to-end browser tests (require running Docker services)",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.pyright]
include = ["src"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    ".venv",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
# SQLAlchemy Column type issues (Column[str] vs str) — not real bugs
reportArgumentType = false
reportAttributeAccessIssue = false
reportGeneralTypeIssues = false
reportReturnType = false
reportAssignmentType = false
reportCallIssue = false
reportOptionalMemberAccess = false
reportIndexIssue = false
reportOptionalOperand = false
# Optional dependencies that may not be installed
reportMissingModuleSource = false

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["kagura"]
